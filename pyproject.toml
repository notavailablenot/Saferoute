[project]
name = "saferoute"
version = "0.1.0"
description = "Real-Time Traffic Sign Detection and Driver Warning System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "ultralytics",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "opencv-python",
    "PyQt6",
    "SQLAlchemy>=2.0",
    "onnxruntime",
    "onnx",
    "albumentations",
    "pyyaml",
    "jupyterlab",
    "ipykernel",
]

[project.optional-dependencies]
   dev = [
       "pytest",
       "ruff",
       "httpx",
   ]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saferoute*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
#E: pycodesctyle, F: Pyflakes, I: isort, B: flake8-bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"