[project]
name = "saferoute"
version = "0.1.0"
description = "Real-Time Traffic Sign Detection and Driver Warning System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "ultralytics",
    "fastapi",
    "uvicorn",
    "opencv-python",
    "PyQt6",
    "SQLAlchemy",
    "onnxruntime",
    "albumentations" 
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saferoute"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["pycodesctyle", "Pyflakes", "isort", "flake8-bugbear", "pyupgrade"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"